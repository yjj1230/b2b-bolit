# D-012 影子轨采用「新单实时增量模式（hook 驱动）」，不依赖存量数据（用户裁决，2026-08-20）
decision_id: D-012
choice: >
  影子轨摄入从「历史全量 + 周期拉取」调整为「新单实时增量模式（hook 驱动）」：
  1) 边界只吃新下单订单（上线之后新产生的订单），历史存量不依赖、不作为 R1 前置，
     存量回填降级为可选动作；
  2) 主通道：旧系统埋点（fire-and-forget POST）或飞书事件订阅，由 T3 调研落定主通道；
     JSONL / 列表每日对账作为兜底，保证采集管道准确；
  3) 「全量重放」重新定义 = 上线以来新单全集 + 内部种子集重放；任一修复后至少重放
     「受影响批次 + 新单全集 + 种子集」，不再要求历史存量全量重放；
  4) 采集与重放分工：采集必须准确（事件到达率 100%、对账丢单 = 采集故障并告警）；
     重放结果允许与飞书不一致——差异进分歧表，数据准确性差异正是校验尺子；
  5) v0.2 安全门槛（D-012 口径）：连续 K 笔新单（默认 20，owner 可调）满足
     节点 UNMAPPED=0、FSM_GAP P0=0、事件到达率 100%、影子终态与飞书对齐
     （滞后 ≤1 同步周期）、零出站/零回写哨兵全绿、覆盖缺口用种子补齐并标注。
rationale: >
  项目 owner 目标为「通过连续的影子系统迭代，保证 v0.2 版本发布的安全系数」：
  客户在飞书操作的同时，把影子系统里相应操作也完成；影子数据 v0.3 后撤销，
  无需长期保存，也不要求影子数据本身「正确」，差异即校验尺子。
  v0.2 将数据正式迁入新系统（唯一状态机与数据真相），除销售 / 主管 / 董事长外全部岗位切到企微体系；
  v0.1 + 影子轨提前完成 v0.2 前的流程校验测试，故影子只需连续验证新单形状，即可支撑 v0.2 数据迁入的安全系数。
premises:
  - project/decisions/D-008.yaml（双轨发布：影子以真实飞书数据驱动完整状态机）
  - project/decisions/D-009.yaml（无托底 + 全节点覆盖/差异映射可接受）
  - project/decisions/D-010.yaml（独立环境、v0.3 后撤销、≤1 万条/天）
  - project/decisions/D-011.yaml（多次发布验证线 + 六同原则）
  - docs/v0.1/12-shadow-full-flow.html §1/§4/§9/§11（影子定位、数据流、修复-重放闭环、门禁）
  - 用户裁决（2026-08-20 对话）：新单实时 hook 同步、影子数据 v0.3 撤销、
    数据准确性差异 = 校验尺子、流程引擎/授权系统随 v0.1 完整发布
objections: []
decider: project-owner（用户直接裁决）
effective_interval: {from: "2026-08-20T00:00:00+00:00", to: null}
supersedes: []
review_condition: >
  ① T3 webhook/埋点可行性结论落档并选定主通道；
  ② 连续 K 笔新单（默认 20）通过 v0.2 安全门槛后复核；
  ③ 如后续需要历史覆盖率，再启动存量回填（可选，不阻塞新单迭代）。
