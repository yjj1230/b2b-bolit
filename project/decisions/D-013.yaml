# D-013 v0.2 / v0.3 最终发布口径：v0.2 数据迁入新系统，v0.3 企微体系发布完成（用户裁决，2026-08-20）
decision_id: D-013
choice: >
  在 D-012 基础上确定 v0.2 / v0.3 的最终口径：
  1) v0.2 发布 = 数据正式迁到新系统：飞书 JSONL → 新系统 PG，新系统成为唯一状态机
     与数据真相；除销售、销售主管、董事长外，商务 / 财务 / 仓管 / 销售助理全部切换到
     新系统企微体系（企微手机 / PC 处理流程）。旧系统复杂流程冻结、不再承接新业务，
     飞书侧只保留为销售 / 主管 / 董事长新增的极简单节点审批 + 轻量飞书通道服务。
  2) v0.3 发布 = 企微体系发布完成：销售、销售主管、董事长也完成企微切换（开放企微
     手机 / PC，新系统审批台处理审价 / 终审 / 开票信息 / 盖章回传）；全量数据一定已经
     全部迁完（存量订单 + 事件链 + 附件四层对账 100% 一致）；旧飞书只读归档 / 下线。
  3) 影子系统撤销条件 = 企微体系发布完成 + 全量数据迁完 + 四层对账通过；
     撤销动作 = 归档报告与分歧清单 → 停栈 → drop b2b_shadow。
  4) 因为 v0.1 + 影子轨已提前完成 v0.2 发布前的流程校验测试（新单实时重放、
     覆盖率 / 分歧 / 对账证据），v0.2 数据迁入的安全系数大幅提高。
rationale: >
  用户确认：v0.1 的影子系统就是为了保证 v0.2 能够正常安全切换；因此 v0.2 不必再走
  「旧系统仍真相 + 受信通道回写」的保守路线，而是直接完成数据迁入与除销售 / 主管 /
  董事长外的全岗位企微切换；v0.3 完成剩余三岗位企微切换，企微体系发布完成，
  全量数据迁完，影子系统随之撤销。
premises:
  - project/decisions/D-008.yaml..D-012.yaml（双轨发布、影子原则、新单实时增量）
  - v0.2_设计_preview.html（讨论稿）最终路线：新系统成为唯一状态机与数据真相，
    商务 / 财务 / 仓管 / 销售助理全部在企微处理流程
  - docs/发布计划v2/渐进式发布计划v2.html（三次发布框架）
  - 用户裁决（2026-08-20 对话）：v0.2 数据正式迁到企微体系；v0.3 销售、主管、
    董事长也完成企微切换；全量数据一定已经全部迁完；影子撤销
objections: []
decider: project-owner（用户直接裁决）
effective_interval: {from: "2026-08-20T00:00:00+00:00", to: null}
supersedes: []
review_condition: >
  ① v0.2 发布前：pgAPI 定位与上游同步停止时点提前到 v0.2 拍板；
     全量迁移工具、附件存储、三角色企微工作台、飞书极简审批通道服务就绪；
  ② v0.3 发布前：销售 / 主管 / 董事长企微审批台与入口就绪；
     全量数据迁完并四层对账通过后，方可执行影子撤销。
