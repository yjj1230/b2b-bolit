<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>场景2 · 企微实时话术参谋｜陈香贵连锁 王建国</title>
<link rel="stylesheet" href="../../shared/css/styles.css">
<style>
/* ==========================================================================
   WeCom PC 暗色模式 · 四栏工作台
   ========================================================================== */
:root {
  --bg-primary: #202124;
  --bg-rail: #2A2B2E;
  --bg-side: #202124;
  --bg-chat: #1F2022;
  --bg-search: #3A3B3D;
  --bg-detail: #1F2022;
  --divider: rgba(255,255,255,0.08);
  --divider-solid: #303236;
  --text-primary: #E6E6E6;
  --text-secondary: #9A9A9A;
  --text-tertiary: #6F7378;
  --brand-blue: #2F7EDB;
  --brand-blue-bubble: #1677D2;
  --badge-red: #F04B4B;
  --bubble-other: #333538;

}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

/* ---------- Scene nav (keep from shared) ---------- */
main.scene-content { padding: 0; max-width: none; width: 100%; }
.scene-page .scene-nav { position: relative; z-index: 100; }

/* ============================
   FOUR-COLUMN LAYOUT
   ============================ */
.app-window {
  display: grid;
  grid-template-columns: 60px 300px 1fr;
  height: calc(100vh - 48px); /* 48px = scene-nav height */
  min-height: 0;
  overflow: hidden;
  background: var(--bg-primary);
}

/* ============================
   COLUMN 1: Sidebar Apps (92px)
   ============================ */
.sidebar-apps {
  width: 60px;
  background: #1B1B1C;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 10px;
  overflow-y: auto;
  scrollbar-width: none;
  position: relative;
  z-index: 5;
}
.sidebar-apps::-webkit-scrollbar { display: none; }

.sb-profile {
  width: 40px; height: 40px;
  border-radius: 6px;
  background: #3A3B3D;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 16px;
  cursor: pointer;
  flex-shrink: 0;
}

.sb-nav-item {
  width: 48px;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: 5px;
  cursor: pointer;
  color: var(--text-tertiary);
  font-size: 11px;
  transition: background 0.1s;
  position: relative;
  margin-bottom: 8px;
  flex-shrink: 0;
}
.sb-nav-item:hover { background: rgba(255,255,255,0.06); }
.sb-nav-item.is-active {
  background: var(--brand-blue);
  color: #fff;
}
.sb-nav-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; }
.sb-nav-item .sb-label { line-height: 1.2; text-align: center; white-space: nowrap; font-size: 10px; }

.sb-badge {
  position: absolute; top: 2px; right: 0;
  background: var(--badge-red);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  padding: 0 4px;
  line-height: 1;
}


/* ============================
   COLUMN 2: Conversation List (510px)
   ============================ */
.conversation-list {
  background: #202021;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--divider-solid);
  min-height: 0;
}

.search-bar {
  height: 65px;
  display: flex; align-items: center;
  padding: 0 16px;
  gap: 8px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--divider);
}
.search-bar .search-input-wrap {
  flex: 1;
  position: relative;
}
.search-bar .search-input-wrap svg {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px;
  stroke: var(--text-tertiary);
  fill: none; stroke-width: 1.8;
  pointer-events: none;
}
.search-bar input {
  width: 100%; height: 34px;
  background: var(--bg-search);
  border: none;
  border-radius: 18px;
  padding: 0 14px 0 34px;
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
}
.search-bar input::placeholder { color: var(--text-tertiary); }
.search-bar .sb-add-btn {
  width: 32px; height: 32px;
  border: none; background: transparent;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.1s;
}
.search-bar .sb-add-btn:hover { background: rgba(255,255,255,0.08); }
.search-bar .sb-add-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
  min-height: 0;
}
.conv-list::-webkit-scrollbar { width: 4px; }
.conv-list::-webkit-scrollbar-track { background: transparent; }
.conv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.conv-item {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 8px;
  padding: 11px 10px 12px;
  cursor: pointer;
  transition: background 0.1s;
  position: relative;
}
.conv-item:hover { background: rgba(255,255,255,0.04); }
.conv-item + .conv-item { border-top: 1px solid var(--divider); }
.conv-item.is-active {
  background: var(--brand-blue);
  border-radius: 6px;
}
.conv-item.is-active + .conv-item { border-top-color: transparent; }

.conv-avatar {
  width: 40px; height: 40px;
  border-radius: 5px;
  background: #3A3B3D;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 600;
  color: var(--text-primary);
  flex-shrink: 0;
  position: relative;
}
.conv-avatar .conv-unread {
  position: absolute; top: -5px; right: -5px;
  min-width: 16px; height: 16px;
  background: var(--badge-red);
  color: #fff;
  font-size: 10px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  padding: 0 4px;
  line-height: 1;
}
.conv-item.is-active .conv-avatar { background: #4A5B8C; }

.conv-meta {
  display: flex; flex-direction: column;
  justify-content: center;
  min-width: 0;
  line-height: 1.3;
}
.conv-top {
  display: flex; align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}
.conv-name {
  font-size: 16px; font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.3;
}
.conv-item.is-active .conv-name { color: #fff; }
.conv-time {
  font-size: 12px; color: var(--text-tertiary);
  margin-left: auto; white-space: nowrap;
  flex-shrink: 0;
}
.conv-item.is-active .conv-time { color: rgba(255,255,255,0.7); }
.conv-preview {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 1px;
}
.conv-item.is-active .conv-preview { color: rgba(255,255,255,0.75); }



/* ============================
   COLUMN 3: Chat Panel
   ============================ */
.chat-panel {
  background: var(--bg-chat);
  display: flex; flex-direction: column;
  min-height: 0;
}

/* -- Chat Header -- */
.chat-header {
  height: 80px;
  display: flex; align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
  position: relative;
}
.chat-header-left { flex: 1; min-width: 0; }
.chat-contact-name {
  font-size: 18px; font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.chat-archive-tip {
  font-size: 13px;
  color: var(--text-tertiary);
}
.chat-header-right {
  flex-shrink: 0;
}
.chat-header-btn {
  width: 32px; height: 32px;
  border: none; background: transparent;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
}
.chat-header-btn:hover { background: rgba(255,255,255,0.06); }
.chat-header-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }

/* -- Chat Body (messages) -- */
.chat-main {
  display: flex; flex-direction: row;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.chat-left {
  display: flex; flex-direction: column;
  flex: 1;
  min-height: 0;
}
.chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px;
  position: relative;
  min-height: 0;
  background: var(--bg-chat);
}
.chat-body > * { position: relative; z-index: 1; }

.chat-body::-webkit-scrollbar { width: 4px; }
.chat-body::-webkit-scrollbar-track { background: transparent; }
.chat-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }



/* Time divider */
.time-divider {
  text-align: center;
  margin: 24px 0 16px;
  font-size: 12px;
  color: var(--text-tertiary);
  position: relative;
}
.time-divider span {
  background: var(--bg-chat);
  padding: 0 12px;
  display: inline-block;
}

/* System tip */
.system-tip {
  text-align: center;
  margin: 12px 0 16px;
  font-size: 13px;
  color: var(--text-tertiary);
  line-height: 1.6;
}

/* Messages container */
.msg {
  display: flex;
  margin-bottom: 20px;
  max-width: 100%;
}
.msg-other { justify-content: flex-start; }
.msg-self { justify-content: flex-end; }

.msg-avatar {
  width: 36px; height: 36px;
  border-radius: 4px;
  background: #3A3B3D;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  color: var(--text-primary);
  flex-shrink: 0;
}
.msg-self .msg-avatar { display: none; }

.msg-body {
  max-width: 520px;
  margin-left: 10px;
}
.msg-self .msg-body { margin-left: 0; margin-right: 8px; }

.msg-sender {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-bottom: 4px;
  padding-left: 2px;
}

.bubble {
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 15px;
  line-height: 1.55;
  word-wrap: break-word;
  position: relative;
}
.bubble b { font-weight: 600; }
.bubble u { text-decoration: underline; text-decoration-color: rgba(255,255,255,0.3); }
.bubble em { font-style: normal; }

.msg-other .bubble {
  background: var(--bubble-other);
  color: var(--text-primary);
  border-top-left-radius: 2px;
}
.msg-self .bubble {
  background: var(--brand-blue-bubble);
  color: #fff;
  border-top-right-radius: 2px;
}

/* File card in bubble */


.msg-time {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 3px;
  padding-left: 2px;
}
.msg-self .msg-time { text-align: right; }



/* ============================
   Sidebar (inside chat-main)
   ============================ */
.customer-detail {
  width: 360px;
  flex-shrink: 0;
  background: var(--bg-detail);
  display: flex; flex-direction: column;
  min-height: 0;
  height: 100%;
  overflow: hidden;
  border-left: 1px solid var(--divider-solid);
}
.chat-panel.sidebar-closed .customer-detail { display: none; }

.detail-tabs {
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  border-bottom: 1px solid var(--divider);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.detail-tabs-inner {
  display: flex;
  align-items: center;
  gap: 0;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  height: 100%;
}
.detail-tabs.is-expanded .detail-tabs-inner {
  flex-wrap: wrap;
  overflow: visible;
  height: auto;
}
.detail-tabs.is-expanded {
  height: auto;
  overflow: visible;
  flex-wrap: wrap;
  padding-bottom: 4px;
  transition: height 0.2s ease;
}
.detail-tab {
  height: 40px;
  padding: 0 8px;
  font-size: 12px;
  color: var(--text-tertiary);
  background: transparent;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  display: flex; align-items: center;
  gap: 2px;
  position: relative;
  transition: color 0.1s;
  flex-shrink: 0;
}
.detail-tab:hover { color: var(--text-secondary); }
.detail-tab.is-active {
  color: var(--text-primary);
  font-weight: 600;
}
.detail-tab.is-active::after {
  content: "";
  position: absolute; bottom: -1px; left: 0; right: 0;
  height: 2px;
  background: var(--brand-blue);
}
.detail-tab-expand {
  margin-left: auto;
  color: var(--brand-blue);
  font-size: 13px;
}
.detail-tab-expand svg {
  width: 14px; height: 14px;
  stroke: currentColor; fill: none; stroke-width: 2;
}

.detail-content {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  height: 100%;
  padding: 0 0 16px;
}
.detail-content::-webkit-scrollbar { width: 4px; }
.detail-content::-webkit-scrollbar-track { background: transparent; }
.detail-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

/* Scene-12 style insight cards */
.insight-cards { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.insight-card {
  background: #28282B;
  border: 1px solid #3A3B3D;
  border-radius: 8px;
  padding: 12px;
}
.insight-card-title {
  font-size: 11px; font-weight: 600;
  color: #9A9A9A;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.insight-card-title .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-blue { background: #3B82F6; }
.dot-green { background: #10B981; }
.dot-purple { background: #8B5CF6; }
.dot-orange { background: #F59E0B; }
.dot-rose { background: #F43F5E; }
.insight-card-body { font-size: 12px; color: #CCC; line-height: 1.5; }
.insight-card-body strong { color: #E6E6E6; }
.insight-card-body .sf-row { display: flex; align-items: center; gap: 4px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
.insight-card-body .sf-row:last-child { border-bottom: none; }
.insight-card-body .sf-key { color: #9A9A9A; min-width: 60px; flex-shrink: 0; font-size: 11px; }
.insight-card-body .sf-val { color: #E6E6E6; font-weight: 500; flex: 1; font-size: 12px; }
.insight-card-body .sf-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; font-size: 9px; font-weight: 700; flex-shrink: 0; }
.insight-card-body .sf-badge-new { background: rgba(59,130,246,0.2); color: #60A5FA; }
.insight-card-body .sf-badge-upd { background: rgba(245,158,11,0.2); color: #FBBF24; }
.insight-card-body .sf-badge-conf { background: rgba(16,185,129,0.2); color: #34D399; }
.insight-card-body .sf-new { background: rgba(59,130,246,0.05); }
.insight-card-body .sf-updated { background: rgba(245,158,11,0.05); }
.insight-card-body .sf-confirmed { background: rgba(16,185,129,0.05); }
.insight-card-body ul { list-style: none; padding: 0; margin: 4px 0; }
.sp-dot { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; }
.sp-dot .sp-label { font-size: 8px; font-weight: 600; color: #6F7378; letter-spacing: 0.02em; width: 20px; text-align: center; }
.sp-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #3A3B3D; }
.sp-done::before { background: #10B981; }
.sp-current::before { background: var(--brand-blue); box-shadow: 0 0 0 2px rgba(47,126,219,0.2); }
.sp-line { display: inline-block; width: 12px; height: 2px; background: #3A3B3D; margin: 0 1px; vertical-align: middle; align-self: center; margin-bottom: 14px; }
.sp-line-done { background: #10B981; }

/* Scene-12 mobile-style tabs & refined sections */
.sb-tabs { display: flex; border-bottom: 0.5px solid rgba(255,255,255,.06); margin-bottom: 12px; }
.sb-tab { flex:1; padding: 8px 0; font-size: 12px; color: rgba(255,255,255,.4); text-align: center; cursor: pointer; border: none; background: none; font-family: inherit; border-bottom: 2px solid transparent; transition: all .15s; }
.sb-tab.active { color: #60A5FA; border-bottom-color: #60A5FA; }
.sb-tab.disabled { color: rgba(255,255,255,.15); cursor: default; }
.sb-tab:hover:not(.disabled) { color: rgba(255,255,255,.6); }

/* Scene-12 mobile-style refined sections */
.sb-section { margin-bottom: 16px; }
.sb-section-title { font-size: 10px; font-weight: 600; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.sb-row { display: flex; align-items: center; padding: 5px 0; border-bottom: 0.5px solid rgba(255,255,255,.06); font-size: 12px; }
.sb-row:last-child { border-bottom: none; }
.sb-key { color: #8B8FA3; min-width: 72px; flex-shrink: 0; font-size: 11px; }
.sb-val { color: rgba(255,255,255,.85); flex: 1; font-size: 12px; }
.sb-val-empty { color: rgba(255,255,255,.2); }
.sb-next-sug { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.9); margin-bottom: 4px; }
.sb-next-reason { font-size: 11px; color: rgba(255,255,255,.4); margin-bottom: 8px; }
.sb-next-script { background: rgba(255,255,255,.04); border: 0.5px solid rgba(255,255,255,.1); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: rgba(255,255,255,.8); line-height: 1.5; margin-bottom: 6px; }
.sb-progress-dots { display: flex; align-items: center; gap: 0; margin-bottom: 8px; padding: 4px 0; }
.sb-pdot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.12); flex-shrink: 0; }
.sb-pdot.done { background: #10B981; }
.sb-pdot.cur { background: #60A5FA; box-shadow: 0 0 0 2px rgba(96,165,250,.2); }
.sb-pbar { width: 20px; height: 2px; background: rgba(255,255,255,.08); flex-shrink: 0; }
.sb-pbar.filled { background: #10B981; }
.sb-stage-info { font-size: 11px; color: rgba(255,255,255,.5); margin-bottom: 6px; }
.sb-stage-info strong { color: rgba(255,255,255,.85); }
.sb-check { font-size: 11px; color: rgba(255,255,255,.6); padding: 2px 0 2px 14px; position: relative; }
.sb-check::before { content: '✓'; position: absolute; left: 0; color: #10B981; font-weight: 700; }
.sb-pending { font-size: 11px; color: rgba(255,255,255,.3); padding: 2px 0 2px 14px; position: relative; }
.sb-pending::before { content: '○'; position: absolute; left: 0; color: rgba(255,255,255,.2); }
.sb-flow-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border: 0.5px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); border-radius: 6px; font-size: 11px; color: rgba(255,255,255,.7); cursor: pointer; font-family: inherit; margin: 2px; transition: all .15s; }
.sb-flow-btn:hover { border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.9); background: rgba(255,255,255,.06); }

/* History timeline entries */
.ht-entry { display: flex; align-items: flex-start; gap: 8px; position: relative; padding-left: 4px; }
.ht-time { font-size: 10px; color: rgba(255,255,255,.35); white-space: nowrap; flex-shrink: 0; padding-top: 1px; min-width: 36px; text-align: right; }
.ht-dot { width: 6px; height: 6px; border-radius: 50%; background: #60A5FA; flex-shrink: 0; margin-top: 4px; position: relative; z-index: 1; }
.ht-entry + .ht-entry::before { content: ''; position: absolute; left: 42px; top: 0; width: 1px; height: 100%; background: rgba(255,255,255,.06); }
.ht-body { flex: 1; min-width: 0; padding-bottom: 8px; }
.ht-label { font-size: 12px; color: rgba(255,255,255,.8); display: block; }
.ht-detail { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 1px; display: block; }
.ht-badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 9px; font-weight: 600; margin-right: 4px; vertical-align: middle; }
.ht-badge-stage { background: rgba(16,185,129,.15); color: #34D399; }
.ht-badge-field { background: rgba(96,165,250,.15); color: #60A5FA; }
.ht-badge-done { background: rgba(16,185,129,.15); color: #34D399; }
.ht-item { font-size: 12px; color: rgba(255,255,255,.7); padding: 3px 0; }
.ht-text { font-size: 12px; color: rgba(255,255,255,.6); }
.ht-empty { font-size: 12px; color: rgba(255,255,255,.25); text-align: center; padding: 20px 0; }
.insight-card-body ul li { padding: 2px 0 2px 12px; position: relative; font-size: 12px; color: #BBB; }

/* ============================

}

.composer-toolbar {

}
.toolbar-left { display: flex; align-items: center; gap: 2px; }
.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 2px; }

.toolbar-btn {

  border: none; background: transparent;
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-tertiary);

}
.toolbar-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

}

.toolbar-btn-quick {
  height: 28px;

}

}

}

/* ============================

}

}

/* Script cards */
.script-card {

}

}

}

}

}

.script-act-btn {

  border-radius: 4px;
  color: var(--text-secondary);

  cursor: pointer;
  display: flex; align-items: center; justify-content: center;

}
.script-act-btn:hover { border-color: var(--brand-blue); color: var(--brand-blue); }

.stage-node {

.takeover-btn:hover { border-color: var(--brand-blue); color: var(--brand-blue); }

.toast {

.toast.is-show { transform: translateY(0); opacity: 1; }

function calcScriptWeight(baseScore, stageIdx, scriptTags) {
  const stage = CRM_STAGES[stageIdx] || CRM_STAGES[0];

  if (stageIdx === 0) {

}

// ============ Render Helpers ============
function createMsgEl(type, content) {
  const el = document.createElement('div');
  el.innerHTML = content;
  return el.firstChild || el;
}

function systemTip(text) {
  const d = document.createElement('div');
  d.className = 'system-tip';
  d.textContent = text;
  return d;
}

function timeDivider(text) {
  const d = document.createElement('div');
  d.className = 'time-divider';
  d.innerHTML = '<span>' + text + '</span>';
  return d;
}

function message(cfg) {
  const wrap = document.createElement('div');
  wrap.className = 'msg msg-' + cfg.side;

  let html = '';
  if (cfg.side === 'other') {
    html += '<div class="msg-avatar">' + (cfg.avatar || '?') + '</div>';
  }

  html += '<div class="msg-body">';
  if (cfg.side === 'other' && cfg.name) {
    html += '<div class="msg-sender">' + cfg.name + '</div>';
  }
  html += '<div class="bubble">' + cfg.content + '</div>';
  html += '<div class="msg-time">' + (cfg.time || '') + '</div>';

  html += '</div>';

  wrap.innerHTML = html;
  return wrap;
}

function scrollBottom(el) {
  el.scrollTop = el.scrollHeight;
}

function nowHM() {
  var d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function addMin(hm, n) {
  var parts = hm.split(':');
  var t = parseInt(parts[0])*60 + parseInt(parts[1]) + n;
  return String(Math.floor(t/60)%24).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}

// ============ Conversation List ============
function renderConvList() {
  convListEl.innerHTML = '';
  var filtered = searchQuery ? CONV_LIST.filter(function(c) {
    return c.name.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1 ||
           c.last.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
  }) : CONV_LIST;
  filtered.forEach(function(c) {
    var row = document.createElement('div');
    row.className = 'conv-item' + (c.id === activeConvId ? ' is-active' : '');
    row.dataset.id = c.id;

    var badgeHtml = c.unread ? '<span class="conv-unread">' + c.unread + '</span>' : '';

    row.innerHTML =
      '<div class="conv-avatar">' + c.name[0] + badgeHtml + '</div>' +
      '<div class="conv-meta">' +
        '<div class="conv-top">' +
          '<span class="conv-name">' + c.name + '</span>' +
          '<span class="conv-time">' + c.time + '</span>' +
        '</div>' +
        '<div class="conv-preview">' + c.last + '</div>' +
      '</div>';

    row.addEventListener('click', function() { switchConversation(c.id); });
    convListEl.appendChild(row);
  });
}

function switchConversation(convId) {
  if (convId === activeConvId) return;
  activeConvId = convId;

  document.querySelectorAll('.conv-item').forEach(function(i) {
    i.classList.toggle('is-active', i.dataset.id === convId);
  });

  chatBody.innerHTML = '';
  round = 1;
  var data = CONV_ROUNDS[convId];

  if (!data) {
    var c = CONV_LIST.find(function(x) { return x.id === convId; });
    chatBody.appendChild(systemTip('已切换到 ' + (c ? c.name : convId)));
    chatBody.appendChild(timeDivider('今天'));
    if (c) {
      chatBody.appendChild(message({
        side: 'other', name: c.name, avatar: c.name[0], colorClass: 'c1',
        content: c.last, time: c.time
      }));
    }
    renderDetail(null);
    updateChatHeader(convId);
    scrollBottom(chatBody);
    return;
  }

  updateChatHeader(convId, data);
  bootstrapConv(data);
}

function updateChatHeader(convId, data) {
  if (data) {
    chatContactName.textContent = data.name + ' @微信';
  } else {
    var c = CONV_LIST.find(function(x) { return x.id === convId; });
    chatContactName.textContent = c ? c.name : convId;
  }
}

function bootstrapConv(data) {
  data.bootstrap.forEach(function(item) {
    if (item.type === 'system') {
      chatBody.appendChild(systemTip(item.text));
    } else if (item.type === 'time-div') {
      chatBody.appendChild(timeDivider(item.text));
    } else if (item.type === 'msg') {
      chatBody.appendChild(message({
        side: item.side,
        name: item.name,
        avatar: item.side === 'self' ? '李' : (item.name ? item.name[0] : '?'),
        colorClass: item.side === 'self' ? 'c4' : data.colorClass,
        content: item.content,
        time: item.time,
        online: item.online || false,
        status: item.status || null
      }));
    }
  });
  scrollBottom(chatBody);
  renderDetail(data.rounds ? data.rounds[round - 1] : null);
}

function renderInsightCards(roundData) {
  var data = CONV_ROUNDS[activeConvId];
  if (!data) {
    detailContent.innerHTML = '<div class="insight-cards"><div class="insight-card"><div class="insight-card-body" style="text-align:center;padding:20px 0;color:#6F7378;">暂无客户数据</div></div></div>';
    return;
  }

  var stageIdx = (roundData && typeof roundData.stage === 'number') ? roundData.stage : data.stage || 0;
  var stage = CRM_STAGES[stageIdx];
  var dwell = getDwellDays(stageIdx);
  var topScript = roundData && roundData.scripts && roundData.scripts.length ? roundData.scripts[0] : null;
  var insightItems = roundData && roundData.insight ? roundData.insight : [];

  // 跟进节奏计算（基于通用跟进模型，可配置周期参数）
  function calcFollowUpPhase(dwellDays) {
    if (dwellDays <= 1) return { phase:'D1', label:'开口跟进', color:'#F59E0B', desc:'当天完成所有基本动作' };
    if (dwellDays <= 2) return { phase:'D2', label:'唤醒跟进', color:'#3B82F6', desc:'唤醒未开口客户+跟踪有意向客户' };
    if (dwellDays <= 4) return { phase:'D4', label:'持续跟进', color:'#8B5CF6', desc:'二次唤醒+标准话术跟进' };
    var n = Math.floor((dwellDays - 5) / 7) + 1;
    return { phase:'D7+' + (n > 1 ? '#' + n : ''), label:'定期唤醒', color:'#6F7378', desc:'每7天一次标准话术唤醒（当前第'+ n +'轮）' };
  }
  var followUp = calcFollowUpPhase(dwell);

  // 客户分类
  function calcCustomerLabel(stageIdx, dwell) {
    if (stageIdx >= 4 && dwell <= 3) return { label:'即将成交', color:'#10B981' };
    if (stageIdx >= 2 && dwell <= 7) return { label:'培育中', color:'#3B82F6' };
    if (dwell >= 14) return { label:'沉睡客户', color:'#6F7378' };
    return { label:'新 leads', color:'#F59E0B' };
  }
  var custLabel = calcCustomerLabel(stageIdx, dwell);

  // Status helpers (scene-12 style)
  function badge(status) {
    if (status === 'new') return '<span class="sf-badge sf-badge-new">+</span>';
    if (status === 'updated') return '<span class="sf-badge sf-badge-upd">~</span>';
    if (status === 'confirmed') return '<span class="sf-badge sf-badge-conf">v</span>';
    return '';
  }
  function rowCls(status) {
    if (!status || status === 'confirmed') return 'sf-row sf-confirmed';
    if (status === 'new') return 'sf-row sf-new';
    if (status === 'updated') return 'sf-row sf-updated';
    return 'sf-row';
  }

  // History entries (simulated from insight items)
  var historyEntries = insightItems.length ? insightItems.map(function(item, idx) {
    var days = idx === 0 ? dwell : dwell - idx;
    return '<div class="ht-entry"><span class="ht-time">' + (days > 0 ? days + '天前' : '今天') + '</span><span class="ht-dot"></span><div class="ht-body"><span class="ht-label">' + item.label + '</span><span class="ht-detail">' + item.detail + '</span></div></div>';
  }).join('') : '';

  var html =
    '<div class="insight-cards">' +

      // Card: 客户画像 (contact header + fields)
      '<div class="insight-card">' +

        // Contact info bar (like mobile version)
        '<div style="display:flex;align-items:center;gap:10px;padding:0 0 12px 0;border-bottom:0.5px solid rgba(255,255,255,.06);margin-bottom:12px;">' +
          '<div style="width:36px;height:36px;border-radius:50%;background:var(--brand-blue);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;flex-shrink:0;">' + data.avatarChar + '</div>' +
          '<div style="flex:1;min-width:0;">' +
            '<div style="font-size:14px;font-weight:600;color:rgba(255,255,255,.9);">' + data.name + '</div>' +
            '<div style="font-size:11px;color:rgba(255,255,255,.4);">销售：小李 | ' + data.company + '</div>' +
          '</div>' +
        '</div>' +

        // 3-tab navigation
        '<div class="sb-tabs">' +
          '<button class="sb-tab active" data-tab="profile">画像</button>' +
          '<button class="sb-tab" data-tab="history">记录</button>' +
          '<button class="sb-tab disabled" data-tab="order">订单</button>' +
        '</div>' +

        // 画像 tab content (profile section)
        '<div class="sb-section">' +
          '<div class="sb-section-title">客户画像</div>' +
          '<div class="sb-row"><span class="sb-key">客户名称</span><span class="sb-val">' + data.name + '</span></div>' +
          '<div class="sb-row"><span class="sb-key">所属公司</span><span class="sb-val">' + data.company + '</span></div>' +
          '<div class="sb-row"><span class="sb-key">所在地区</span><span class="sb-val">' + data.region + '</span></div>' +
          (data.profile ? '<div class="sb-row"><span class="sb-key">客户类型</span><span class="sb-val">' + data.profile.customerType.label + '</span></div>' : '') +
          (data.profile ? '<div class="sb-row"><span class="sb-key">决策角色</span><span class="sb-val">' + data.profile.decisionRole.label + '</span></div>' : '') +
          (data.profile ? '<div class="sb-row"><span class="sb-key">线索来源</span><span class="sb-val">' + data.profile.leadSource.label + '</span></div>' : '') +
          (data.profile ? '<div class="sb-row"><span class="sb-key">菜系</span><span class="sb-val">' + data.profile.cuisine.label + '</span></div>' : '') +
          (data.profile ? '<div class="sb-row"><span class="sb-key">预算范围</span><span class="sb-val">' + data.profile.budget + '</span></div>' : '') +
          '<div class="sb-row"><span class="sb-key">当前阶段</span><span class="sb-val">' + (stage ? stage.name + ' · ' + stage.weight : '-') + '</span></div>' +
          '<div class="sb-row"><span class="sb-key">停留天数</span><span class="sb-val">' + dwell + ' 天</span></div>' +
        '</div>' +

        // 跟进计划
        '<div class="sb-section">' +
          '<div class="sb-section-title">跟进计划</div>' +
          '<div class="sb-row"><span class="sb-key">跟进节奏</span><span class="sb-val"><span style="color:' + followUp.color + ';font-weight:600;">' + followUp.phase + '</span> ' + followUp.label + '</span></div>' +
          '<div class="sb-row"><span class="sb-key">客户分类</span><span class="sb-val"><span style="background:' + custLabel.color + '20;color:' + custLabel.color + ';padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600;">' + custLabel.label + '</span></span></div>' +
          '<div class="sb-row"><span class="sb-key">距离下次跟进</span><span class="sb-val" style="font-size:11px;color:#9A9A9A;">' + followUp.desc + '</span></div>' +
        '</div>' +

        // 核心关注（从 profile 取）
        (data.profile && data.profile.concerns && data.profile.concerns.length ? '' +
        '<div class="sb-section">' +
          '<div class="sb-section-title">核心关注</div>' +
          data.profile.concerns.map(function(c){ return '<div class="sb-check">' + c + '</div>'; }).join('') +
        '</div>' +
        '' : '') +



      '</div>' +  // end insight-card

      // Card 2: 跟进记录
      '<div class="insight-card">' +
        '<div class="sb-section" style="margin-bottom:0;">' +
          '<div class="sb-section-title">跟进记录</div>' +
          (historyEntries ? '<div style="display:flex;flex-direction:column;gap:4px;">' + historyEntries + '</div>' : '<div class="ht-empty">暂无跟进记录</div>') +
        '</div>' +
      '</div>' +
    '</div>';

  detailContent.innerHTML = html;
}

function renderScriptTab(roundData) {
  if (!roundData || !roundData.scripts || !roundData.scripts.length) {
    detailContent.innerHTML = '<div class="insight-cards"><div class="insight-card"><div class="insight-card-body" style="text-align:center;padding:20px 0;color:#6F7378;">暂无推荐话术</div></div></div>';
    return;
  }

  var stageIdx = roundData.stage || 0;
  var riskClass = getStageRisk(stageIdx);
  var dwell = getDwellDays(stageIdx);
  var stage = CRM_STAGES[stageIdx];

  // Stage progress dots
  var stageDots = '';
  CRM_STAGES.forEach(function(s, i) {
    if (i > 0) stageDots += '<span class="sp-line' + (i <= stageIdx ? ' sp-line-done' : '') + '"></span>';
    stageDots += '<span class="sp-dot' + (i < stageIdx ? ' sp-done' : i === stageIdx ? ' sp-current' : '') + '"><span class="sp-label">' + s.id + '</span></span>';
  });

  // Script cards — 平铺列表，无嵌套卡片
  var scriptsHtml = roundData.scripts.map(function(s, i) {
    var adjScore = calcScriptWeight(s.score, stageIdx, s.tags);
    var scoreColor = adjScore >= 85 ? '#10B981' : adjScore >= 70 ? '#60A5FA' : '#6F7378';
    var levelLabel = s.level === 'top' ? '首选' : (s.level === 'mid' ? '备选' : '参考');

    var sep = i > 0 ? '<div style="height:1px;background:rgba(255,255,255,0.06);margin:12px 0;"></div>' : '';

    return sep +
      '<div style="margin-bottom:4px;">' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">' +
          '<span style="display:inline-flex;align-items:center;gap:4px;background:' + scoreColor + '18;color:' + scoreColor + ';font-weight:700;font-size:13px;padding:1px 7px;border-radius:4px;line-height:1.5;">' + adjScore + '<span style="font-weight:500;font-size:10px;opacity:0.7;">' + levelLabel + '</span></span>' +
          '<span style="font-size:10px;color:#6F7378;margin-left:auto;">' + s.tags.slice(0,2).join(' · ') + '</span>' +
        '</div>' +
        '<div style="font-size:13px;color:#D4D4D8;line-height:1.65;margin-bottom:6px;">' + s.text + '</div>' +
        '<div style="font-size:11px;color:#6F7378;margin-bottom:8px;padding-left:1px;">' + s.why + '</div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button class="flow-btn" data-action="insert" style="flex:1;height:26px;font-size:11px;">插入输入框</button>' +
          '<button class="flow-btn" data-action="send-direct" style="flex:1;height:26px;font-size:11px;border-color:var(--brand-blue);color:var(--brand-blue);">直接发送</button>' +
        '</div>' +
      '</div>';
  }).join('');

  // 各阶段目标 + 待办（参考场景3 SOP定义）
  var STAGE_GOALS = ['确认需求','报价推进','方案确认','合同签署','发货完成','回款入账','交付验收','沉睡唤醒'];
  var stageGoal = STAGE_GOALS[stageIdx] || '';
  var STAGE_TODOS = [
    ['发送欢迎消息','发送方案资料','安排试菜体验','确认客户需求'],
    ['发送详细报价','安排上门时间'],
    ['确认签约意向','准备合同草案'],
    ['推进合同签署'],
    ['确认发货安排'],
    ['确认回款对账'],
    ['确认安装交付','发送满意度调查'],
    ['发送沉睡唤醒消息']
  ];
  var stageTodos = STAGE_TODOS[stageIdx] || [];
  // 模拟已完成——前 n 个已完成，第 n+1 个是下一步
  var doneCount = Math.min(dwell < 7 ? Math.floor(dwell / 3) : stageTodos.length - 1, stageTodos.length - 1);
  var nextTodo = stageTodos[doneCount] || stageTodos[0] || '';

  // Risk text
  var riskText = '';
  if (riskClass === 'warn') {
    riskText = '<div style="font-size:11px;color:#F59E0B;margin-bottom:6px;">当前阶段已停留 ' + dwell + ' 天，建议加速推进</div>';
  } else if (riskClass === 'danger') {
    riskText = '<div style="font-size:11px;color:#F04B4B;margin-bottom:6px;">风险升级：已停留 ' + dwell + ' 天，需立即干预</div>';
  }

  var html =
    '<div class="insight-cards">' +
      // Card 1: 阶段进度
      '<div class="insight-card">' +
        '<div class="insight-card-title"><span class="dot dot-green"></span>阶段进度</div>' +
        '<div class="insight-card-body">' +
          '<div style="font-size:12px;color:#9A9A9A;margin-bottom:4px;"><strong style="color:#E6E6E6;">' + roundData.stageName + '</strong> · 目标: <span style="color:#60A5FA;">' + stageGoal + '</span> · 停留 ' + dwell + ' 天</div>' +
          (nextTodo ? '<div style="font-size:11px;color:#10B981;margin-bottom:4px;">待办: <span style="color:#D4D4D8;">' + nextTodo + '</span></div>' : '') +
          riskText +
          '<div style="display:flex;align-items:center;gap:2px;padding:4px 0;">' + stageDots + '</div>' +
        '</div>' +
      '</div>' +
      // Card 2: 推荐话术
      '<div class="insight-card">' +
        '<div class="insight-card-title"><span class="dot dot-blue"></span>推荐话术 <span style="font-weight:400;color:#6F7378;text-transform:none;">（动态评分已适配阶段权重）</span></div>' +
        '<div class="insight-card-body">' + scriptsHtml + '</div>' +
      '</div>' +
    '</div>';

  detailContent.innerHTML = html;

  // Bind action buttons
  detailContent.querySelectorAll('[data-action="insert"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var scriptEl = btn.closest('[style*="margin-bottom"]');
      if (!scriptEl) return;
      var textDiv = scriptEl.querySelector('[style*="color:#D4D4D8"]');
      if (textDiv) {
        chatInput.value = textDiv.innerText.trim();
        chatInput.focus();
      }
    });
  });
  detailContent.querySelectorAll('[data-action="send-direct"]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var scriptEl = btn.closest('[style*="margin-bottom"]');
      if (!scriptEl) return;
      var textDiv = scriptEl.querySelector('[style*="color:#D4D4D8"]');
      if (textDiv) {
        chatInput.value = textDiv.innerText.trim();
        sendUserMessage();
      }
    });
  });
}

// ============ Customer Detail Tab Switching ============
detailTabs.addEventListener('click', function(e) {
  var t = e.target.closest('.detail-tab');
  if (!t) return;
  // Expand toggle
  if (t.id === 'tabExpandBtn') {
    detailTabs.classList.toggle('is-expanded');
    var isExpanded = detailTabs.classList.contains('is-expanded');
    t.innerHTML = (isExpanded ? '收起' : '展开') + '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;"><polyline points="' + (isExpanded ? '18 15 12 9 6 15' : '6 9 12 15 18 9') + '"/></svg>';
    return;
  }
  var tab = t.dataset.tab;
  if (!tab) return;
  activeTab = tab;
  detailTabs.querySelectorAll('.detail-tab').forEach(function(x) { x.classList.remove('is-active'); });
  t.classList.add('is-active');
  renderDetail(getActiveRound());
  // Collapse after switching tabs
  detailTabs.classList.remove('is-expanded');
});

// Overflow detection for tabs
function checkTabOverflow() {
  var inner = document.getElementById('detailTabsInner');
  var btn = document.getElementById('tabExpandBtn');
  var tabs = document.getElementById('detailTabs');
  if (!inner || !btn || !tabs) return;
  // 如果已展开，不要隐藏按钮（用户需要它来收起）
  if (tabs.classList.contains('is-expanded')) { btn.style.display = 'flex'; return; }
  if (inner.scrollWidth > inner.clientWidth) {
    btn.style.display = 'flex';
  } else {
    btn.style.display = 'none';
  }
}
// Check on load and on resize
window.addEventListener('resize', checkTabOverflow);
checkTabOverflow();

// ============ Send Message ============
function sendUserMessage() {
  var text = (chatInput.value || '').trim();
  if (!text) return;
  chatInput.value = '';

  var now = nowHM();
  var data = CONV_ROUNDS[activeConvId];

  var myMsg = message({
    side: 'self', name: '我（小李 · 销售）', avatar: '李', colorClass: 'c4',
    content: text, time: now, status: 'sending'
  });
  chatBody.appendChild(myMsg);
  scrollBottom(chatBody);

  // Simulate "read"
  setTimeout(function() {
    var bubble = myMsg.querySelector('.bubble');
    if (bubble) {
      var timeEl = myMsg.querySelector('.msg-time');
      if (timeEl) timeEl.textContent = now + ' 已读';
    }
  }, 900);

  // Customer reply
  var rounds = getActiveRounds();
  if (rounds && round <= rounds.length) {
    var rd = rounds[round - 1];
    var markMap = { 0:'turn', 1:'loss', 2:'turn' };

    // Show typing
    var typingMsg = message({
      side: 'other', name: data.name, avatar: data.avatarChar, colorClass: data.colorClass,
      content: '<span style="color:var(--text-tertiary);font-style:italic;">正在输入…</span>',
      time: addMin(now, 1)
    });
    chatBody.appendChild(typingMsg);
    scrollBottom(chatBody);

    // Replace with real reply after delay
    setTimeout(function() {
      typingMsg.remove();
      var replyMsg = message({
        side: 'other', name: data.name, avatar: data.avatarChar, colorClass: data.colorClass,
        content: rd.reply.text,
        time: addMin(now, 1)
      });
      chatBody.appendChild(replyMsg);
      scrollBottom(chatBody);

      round = Math.min(round + 1, rounds.length);
      renderDetail(getActiveRound());

      // Clear unread badge
      var conv = CONV_LIST.find(function(c) { return c.id === activeConvId; });
      if (conv && conv.unread > 0) { conv.unread = 0; renderConvList(); }
    }, 1100 + Math.random()*600);
  } else {
    // No more rounds
    setTimeout(function() {
      chatBody.appendChild(message({
        side: 'other', name: data ? data.name : '客户', avatar: data ? data.avatarChar : '?',
        colorClass: data ? data.colorClass : 'c1',
        content: '好的，我再看看。', time: nowHM()
      }));
      scrollBottom(chatBody);
    }, 800);
  }
}

function getActiveData() { return CONV_ROUNDS[activeConvId] || null; }
function getActiveRounds() { var d = getActiveData(); return d ? d.rounds : null; }
function getActiveRound() { var r = getActiveRounds(); if (!r) return null; return r[round - 1] || null; }

// ============ Init ============
function bootstrap() {
  var data = getActiveData();
  if (data) {
    updateChatHeader(activeConvId, data);
    bootstrapConv(data);
  } else {
    chatBody.appendChild(systemTip('已连接到 ' + activeConvId));
    chatBody.appendChild(timeDivider('今天'));
  }
}

// ============ Event Binding ============
sendBtn.addEventListener('click', sendUserMessage);
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendUserMessage();
  }
});

// Takeover toggle
takeoverBtn.addEventListener('click', function() {
  var isActive = this.classList.toggle('is-active');
  if (isActive) {
    var t = new Date();
    var timeStr = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    document.getElementById('takeoverTime').textContent = timeStr;
    toastEl.classList.add('is-show');
    setTimeout(function() { toastEl.classList.remove('is-show'); }, 2500);
    this.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg><span>人工接管中</span>';
  } else {
    this.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg><span>AI 辅助</span>';
  }
});

// Search
searchInput.addEventListener('input', function() {
  searchQuery = this.value.trim();
  renderConvList();
});

// Sidebar toggle
sidebarToggle.addEventListener('click', function() {
  chatPanel.classList.toggle('sidebar-closed');
});

renderConvList();
bootstrap();
</script>
