<style>
:root{

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; overflow:hidden;}
a{color:#7dd3fc; text-decoration:none;} a:hover{text-decoration:underline;}
button{font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:8px; padding:5px 9px;}
button.on{background:#e11d48; border-color:#e11d48; color:#fff;}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#24334f;border-radius:8px}
header{height:54px; display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#111c30,#0b1220); position:relative; z-index:5;}
header h1{font-size:16px; white-space:nowrap;}
header h1 .star{color:#fb7185;}
header .sub{color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
header .spacer{flex:1;}
#searchBox{width:280px; padding:7px 11px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); font-size:12px; outline:none;}

#stats{color:var(--muted); font-size:11px; white-space:nowrap;}

#legendBar{display:flex; gap:14px; flex-wrap:wrap; align-items:center; padding:6px 14px; border-bottom:1px solid var(--line); background:#0f1930;}
.legend-item{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); cursor:pointer; user-select:none; padding:2px 6px; border-radius:6px;}
.legend-item .dot{width:9px; height:9px; border-radius:50%;}
.legend-item.off{opacity:.35;}
.statusLegend{margin-left:auto; display:flex; gap:8px; align-items:center; font-size:10px; color:var(--muted);}
.statusLegend .ring{width:10px;height:10px;border-radius:50%; border:2px solid;}
/* main */
#main{display:flex; height:calc(100% - 54px - 34px);}
#graphWrap{flex:1.6; position:relative; min-width:0; background:
  radial-gradient(1100px 500px at 20% 30%, rgba(251,113,133,.05), transparent 60%),
  radial-gradient(900px 520px at 85% 60%, rgba(52,211,153,.05), transparent 60%),
  radial-gradient(800px 500px at 60% 15%, rgba(56,189,248,.05), transparent 60%);}
#graphWrap svg{width:100%; height:100%; display:block; cursor:grab;}
#graphWrap svg.drag{cursor:grabbing;}
.nodeG{cursor:pointer;}
.nodeG.dimmed{opacity:.10;}
.nodeG.found{opacity:1;}
.nodeG text{font-size:9.5px; fill:var(--text); text-anchor:middle; pointer-events:none; paint-order:stroke; stroke:#0b1220; stroke-width:2.6px; stroke-linejoin:round;}
.nodeG text.hl{font-weight:700; font-size:11px;}
.nodeG circle{filter:drop-shadow(0 0 4px rgba(0,0,0,.55));}
.edgeLine{stroke:#3b4d6d; stroke-width:1; opacity:.34;}
.edgeLine.found{opacity:.9;}
.edgeLabel{font-size:8.5px; fill:#7c8db0; text-anchor:middle; pointer-events:none; paint-order:stroke; stroke:#0b1220; stroke-width:2.2px;}
#tooltip{position:absolute; display:none; max-width:280px; background:#0f1930f2; border:1px solid var(--line); border-radius:10px; padding:8px 10px; pointer-events:none; z-index:9;}

#tooltip .t2{font-size:10.5px; color:var(--muted); line-height:1.5;}
.zoomBtn{position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:5px;}
.zoomBtn button{width:30px; height:30px; padding:0; font-size:15px;}

#side{width:420px; min-width:360px; max-width:44vw; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column;}
#tabs{display:flex; gap:4px; padding:8px 10px; border-bottom:1px solid var(--line);}
#sideBody{flex:1; overflow:auto; padding:10px 12px;}
.groupTitle{color:var(--muted); font-size:11px; margin:12px 0 6px; padding-left:4px; border-left:3px solid var(--line);}
.nodeRow{display:flex; gap:6px; align-items:flex-start; padding:6px 8px; border-radius:8px; cursor:pointer; margin-bottom:3px; background:#0f1930;}
.nodeRow:hover{outline:1px solid var(--line);}

.badge{display:inline-block; font-size:10px; padding:1px 6px; border-radius:6px; margin-right:4px; border:1px solid var(--line); color:var(--muted);}
.badge.dim-req{border-color:#c084fc;color:#c084fc} .badge.dim-cfg{border-color:#38bdf8;color:#38bdf8}
.badge.dim-db{border-color:#f59e0b;color:#f59e0b} .badge.dim-code{border-color:#34d399;color:#34d399}
.badge.dim-ext{border-color:#fb7185;color:#fb7185} .badge.dim-data{border-color:#22d3ee;color:#22d3ee}
.badge.st-ok{border-color:#34d399;color:#34d399} .badge.st-partial{border-color:#fbbf24;color:#fbbf24}
.badge.st-pending{border-color:#fb923c;color:#fb923c} .badge.st-external{border-color:#f472b6;color:#f472b6}
.badge.st-defer{border-color:#64748b;color:#94a3b8}
#sideBody h2{font-size:16px; margin:8px 0 6px;}
#sideBody .ans{line-height:1.65; color:#cbd5e1; font-size:12.5px; background:#0f1930; border:1px solid var(--line); border-radius:10px; padding:9px 11px; white-space:pre-wrap;}
#sideBody .verifyBox{margin-top:8px; background:#121a2c; border-left:3px solid #fb923c; border-radius:8px; padding:7px 10px; font-size:12px; line-height:1.6; color:#fdba74;}
#sideBody .src{font-size:10.5px; color:var(--muted); margin-top:8px; line-height:1.6;}
#sideBody h4{font-size:11.5px; color:var(--muted); margin:12px 0 5px;}
.relChip{display:inline-block; background:#16233b; border:1px solid var(--line); border-radius:8px; padding:2px 8px; margin:0 4px 5px 0; font-size:10.5px; cursor:pointer;}
.relChip:hover{border-color:#7dd3fc;}
.empty{color:var(--muted); padding:14px;}
.chkRow{display:flex; gap:8px; align-items:flex-start; padding:5px 8px; border-radius:8px; background:#0f1930; margin-bottom:3px; cursor:pointer;}
.chkRow:hover{outline:1px solid var(--line);}
.chkRow input{margin-top:3px; accent-color:#34d399;}
.chkRow .body{flex:1;}

.chkRow.done .t{text-decoration:line-through;}
.progress{display:flex; gap:4px; height:8px; border-radius:5px; overflow:hidden; background:#1e293b; margin:4px 0 10px;}
.progress .seg{height:100%;}
.dimSummary{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.dimSummary .item{font-size:10.5px; color:var(--muted); background:#0f1930; border:1px solid var(--line); border-radius:8px; padding:3px 8px; cursor:pointer;}

    line.setAttribute('class','edgeLine'); line.dataset.src=e.src; line.dataset.dst=e.dst;
    if(e.dash) line.setAttribute('stroke-dasharray','4 4');
    line.addEventListener('mouseenter',ev=>showTip(ev,{name:(nodeById[e.src]?.name||e.src)+' → '+(nodeById[e.dst]?.name||e.dst), type:'关系'+(e.label?(' · '+e.label):''), text:'点击任一端节点查看详情'}));
    line.addEventListener('mouseleave',hideTip);
    world.appendChild(line); edgeEls.push(line);
    if(e.show && e.label){
      const lt=document.createElementNS(SVG_NS,'text');
      lt.setAttribute('x',(a.x+b.x)/2); lt.setAttribute('y',(a.y+b.y)/2-3);
      lt.setAttribute('class','edgeLabel'); lt.textContent=e.label;
      world.appendChild(lt);
    }
  }
  // nodes
  for(const n of NODES){
    const p=pos[n.id]; if(!p) continue;
    const g=document.createElementNS(SVG_NS,'g');
    g.setAttribute('class','nodeG'); g.dataset.id=n.id;
    g.setAttribute('transform',`translate(${p.x},${p.y})`);
    const r = n.id==='r_root'?13 : (n.id.startsWith('d_')||n.id.startsWith('g_')?7 : 5.5);
    const c=document.createElementNS(SVG_NS,'circle');
    c.setAttribute('r',r); c.setAttribute('fill', DIMS[n.dim].color);
    c.setAttribute('stroke', STATUS[n.status].color); c.setAttribute('stroke-width', n.id==='r_root'?3:1.8);
    g.appendChild(c);
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('x',0); t.setAttribute('y',r+8.5); t.textContent=n.name;
    if(n.id==='r_root' || n.id.startsWith('d_') || n.id.startsWith('g_')) t.setAttribute('class','hl');
    g.appendChild(t);
    if(n.id==='r_root'){
      const s=document.createElementNS(SVG_NS,'text');
      s.setAttribute('class','star'); s.setAttribute('x',0); s.setAttribute('y',4.5);
      s.setAttribute('style','font-size:11px;fill:#fff;text-anchor:middle;pointer-events:none;'); s.textContent='★';
      g.appendChild(s);
    }
    g.addEventListener('click',ev=>{ev.stopPropagation(); showDetail(n.id);});
    g.addEventListener('mouseenter',ev=>showTip(ev,n));
    g.addEventListener('mouseleave',hideTip);
    world.appendChild(g); nodeEls.push(g);
  }
  applyVisibility();
}
function applyVisibility(){
  for(const g of nodeEls){
    const n=nodeById[g.dataset.id];
    let dimmed=!visibleDims.has(n.dim);
    if(searchMode) dimmed = dimmed || !searchHits.has(n.id);
    g.classList.toggle('dimmed', dimmed);
    g.classList.toggle('found', searchMode && searchHits.has(n.id));
    g.classList.toggle('selected', selected===n.id);
  }
  for(const l of edgeEls){
    if(!searchMode){ l.style.opacity=''; return; }
    const s=l.dataset.src, d=l.dataset.dst;
    l.classList.toggle('found', searchHits.has(s)&&searchHits.has(d));
    l.style.opacity = (searchHits.has(s)&&searchHits.has(d)) ? '.85' : '.04';
  }
}

/* ---------------- interaction ---------------- */
let visibleDims=new Set(Object.keys(DIMS)), selected=null, searchMode=false, searchHits=new Set(), activeTab='detail';
let translate={x:0,y:0}, scale=1;
function applyTransform(){ world.setAttribute('transform',`translate(${translate.x},${translate.y}) scale(${scale})`); }
function fitView(){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const n of NODES){ const p=pos[n.id]; minX=Math.min(minX,p.x-30); minY=Math.min(minY,p.y-30); maxX=Math.max(maxX,p.x+30); maxY=Math.max(maxY,p.y+30); }
  const w=maxX-minX||1, h=maxY-minY||1;
  const wrap=document.getElementById('graphWrap').getBoundingClientRect();
  scale=Math.min(wrap.width/w, wrap.height/h, 1.0);
  translate={x:wrap.width/2-scale*(minX+maxX)/2, y:wrap.height/2-scale*(minY+maxY)/2};
  applyTransform();
}
function showTip(ev,n){
  const tip=document.getElementById('tooltip');
  tip.style.display='block';
  tip.innerHTML=`<div class="t1">${esc(n.name)}</div><div class="t2">${esc(n.type||'')} · ${DIMS[n.dim]?DIMS[n.dim].name:''} · ${STATUS[n.status]?STATUS[n.status].name:''}</div><div class="t2">${esc((n.text||'').slice(0,140))}${(n.text||'').length>140?'…':''}</div>`;
  const wrap=document.getElementById('graphWrap').getBoundingClientRect();
  tip.style.left=Math.min(ev.clientX-wrap.left+12, wrap.width-285)+'px';
  tip.style.top=Math.max(ev.clientY-wrap.top-30, 4)+'px';
}
function hideTip(){document.getElementById('tooltip').style.display='none';}
function selectNode(id){ selected=id; applyVisibility(); }

function renderSrc(src){
  return String(src||'').split('·').map(s=>{
    let t=s.trim(); if(!t) return '';
    // 文件路径 → 可点击（相对链接，随仓库目录打开可用）
    const fm=t.match(/^([A-Za-z0-9_\-./]+\.[a-z]{2,5})(.*)$/i);
    if(fm){
      const path=fm[1], rest=fm[2].trim();
      return `<a href="${esc(path)}" target="_blank">${esc(path)}</a>${rest?(' '+esc(rest)):''}`;
    }
    const dm=t.match(/^D-(\d{3})$/);
    if(dm){ const p=`project/decisions/D-${dm[1]}.yaml`; return `<a href="${p}" target="_blank">${esc(t)}</a>`; }
    return esc(t);
  }).join(' · ');
}
function showDetail(id){
  const n=nodeById[id]; if(!n) return;
  selectNode(id); setTab('detail');
  const body=document.getElementById('sideBody');
  const rels=relOf(id).slice(0,24);
  let chips=rels.map(e=>{
    const other=e.src===id?e.dst:e.src; const o=nodeById[other]; if(!o) return '';
    const label = e.src===id ? (e.label?('→ '+e.label):'→') : ((e.label?e.label+' →':'→'));
    return `<span class="relChip" onclick="showDetail('${other}')">${esc(label)} ${esc(o.name)}</span>`;
  }).join('');
  body.innerHTML=`
   <span class="badge dim-${n.dim}">${DIMS[n.dim].name}</span>
   <span class="badge st-${n.status}">${STATUS[n.status].name}</span>
   <span class="badge">${esc(n.type)}</span>
   <h2>${esc(n.name)}</h2>
   <div class="ans">${esc(n.text||'')}</div>
   <div class="verifyBox"><b>✔ 发布准备核验点：</b>${esc(n.verify||'—')}</div>
   <div class="src">📄 来源：${renderSrc(n.src||'')}</div>
   <h4>关联（${rels.length}${rels.length>=24?'+':''}）</h4>
   <div>${chips||'<span class="empty">无关联</span>'}</div>`;
}
function renderList(){
  const body=document.getElementById('sideBody');
  let html='';
  for(const dim of ['req','cfg','db','code','ext','data']){
    const arr=groupBy[dim]||[];
    const stCount={}; arr.forEach(x=>stCount[x.status]=(stCount[x.status]||0)+1);
    const stTxt=Object.entries(stCount).map(([s,c])=>`${STATUS[s].name.slice(0,2)}${c}`).join(' · ');
    html+=`<div class="groupTitle">${DIMS[dim].name}（${arr.length}） · ${stTxt}</div>`;
    for(const n of arr){
      html+=`<div class="nodeRow" onclick="showDetail('${n.id}')"><span class="nm" style="color:${DIMS[dim].color}">${esc(n.name)}</span><span class="ty">${esc(n.type)}</span><span class="tx">${esc((n.text||'').split('\n')[0])}</span><span class="badge st-${n.status}">${STATUS[n.status].name}</span></div>`;
    }
  }
  body.innerHTML=html;
}
function renderCheck(){
  const body=document.getElementById('sideBody');
  const ls={}; try{ ls=JSON.parse(localStorage.getItem('v01kg-check')||'{}'); }catch(err){}
  let html=`<div class="empty" style="padding:6px 2px">发布准备核验清单：逐项确认后勾选，进度保存在浏览器本地。状态图例即节点外圈颜色。</div>`;
  html+=`<div class="dimSummary">`;
  for(const dim of ['req','cfg','db','code','ext','data']){
    const arr=groupBy[dim]||[]; const done=arr.filter(x=>ls[x.id]).length;
    html+=`<div class="item" onclick="jumpDim('${dim}')">${DIMS[dim].name} ${done}/${arr.length}</div>`;
  }
  html+=`</div>`;
  for(const dim of ['req','cfg','db','code','ext','data']){
    const arr=groupBy[dim]||[];
    let done=0, partial=0, pending=0;
    arr.forEach(x=>{ if(ls[x.id]) done++; else if(x.status==='ok'||x.status==='partial') partial++; else if(x.status==='pending') pending++; });
    const total=arr.length;
    const pct=Math.round((done+(arr.filter(x=>x.status==='defer'||x.status==='external').length))/total*100);
    html+=`<div class="groupTitle" id="dim-${dim}">${DIMS[dim].name}（${arr.length}） · 已核 ${done} · 待核 ${total-done}</div>`;
    html+=`<div class="progress">${[['ok','#34d399'],['partial','#fbbf24'],['pending','#fb923c'],['external','#f472b6'],['defer','#64748b']].map(([s,c])=>{const cnt=arr.filter(x=>x.status===s).length; return cnt?`<div class="seg" style="width:${(cnt/total*100).toFixed(1)}%;background:${c}"></div>`:'';}).join('')}</div>`;
    for(const n of arr){
      const checked=!!ls[n.id];
      html+=`<div class="chkRow ${checked?'done':''}" onclick="toggleChk('${n.id}')">
        <input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleChk('${n.id}')"/>
        <div class="body"><div class="t"><span style="color:${DIMS[dim].color}">${esc(n.name)}</span> <span class="badge st-${n.status}">${STATUS[n.status].name}</span> <span class="ty" style="color:var(--muted)">${esc(n.type)}</span></div>
        <div class="v">✔ ${esc(n.verify||'')}</div></div></div>`;
    }
  }
  body.innerHTML=html;
}
function toggleChk(id){
  const ls={}; try{ ls=JSON.parse(localStorage.getItem('v01kg-check')||'{}'); }catch(err){}
  ls[id]=!ls[id];
  localStorage.setItem('v01kg-check', JSON.stringify(ls));
  renderCheck();
}
function jumpDim(dim){ document.getElementById('dim-'+dim)?.scrollIntoView({behavior:'smooth'}); }

/* tabs */
function setTab(name){
  activeTab=name;
  ['tabDetail','tabList','tabCheck'].forEach(id=>document.getElementById(id).classList.toggle('on', id==='tab'+name[0].toUpperCase()+name.slice(1)));
  if(name==='list') renderList();
  if(name==='check') renderCheck();
}
['tabDetail','tabList','tabCheck'].forEach(id=>document.getElementById(id).addEventListener('click',()=>setTab(id.replace('tab','').toLowerCase())));

/* search */
const searchBox=document.getElementById('searchBox');
function doSearch(q){
  const nq=String(q||'').trim().toLowerCase();
  searchMode=false; searchHits=new Set();
  if(!nq){ applyVisibility(); return; }
  searchMode=true;
  const hitIds=new Set();
  for(const n of NODES){
    const hay=(n.name+' '+(n.kw||'')+' '+(n.type||'')+' '+(n.text||'')).toLowerCase();
    if(hay.includes(nq)) hitIds.add(n.id);
  }
  // include direct neighbours
  const neigh=new Set(hitIds);
  for(const id of [...hitIds]){ for(const e of EDGES){ if(e.src===id) neigh.add(e.dst); if(e.dst===id) neigh.add(e.src); } }
  searchHits=neigh;
  applyVisibility();
  const body=document.getElementById('sideBody');
  const direct=[...hitIds].map(id=>nodeById[id]);
  let html=`<div class="groupTitle">搜索「${esc(q)}」：直接命中 ${direct.length} 节点（含相邻节点已在图中高亮）</div>`;
  for(const n of direct.slice(0,60)){
    html+=`<div class="nodeRow" onclick="showDetail('${n.id}')"><span class="nm" style="color:${DIMS[n.dim].color}">${esc(n.name)}</span><span class="ty">${esc(n.type)}</span><span class="tx">${esc((n.text||'').split('\n')[0])}</span></div>`;
  }
  if(!direct.length) html+=`<div class="empty">未命中，试试「pgAPI」「回单」「影子」「DSN」「密钥」等</div>`;
  body.innerHTML=html;
}
searchBox.addEventListener('input',()=>doSearch(searchBox.value));

/* pan/zoom */
let dragging=false, dx=0, dy=0;
svg.addEventListener('mousedown',e=>{ if(e.target===svg){dragging=true; svg.classList.add('drag'); dx=e.clientX-translate.x; dy=e.clientY-translate.y;} });
window.addEventListener('mousemove',e=>{ if(!dragging) return; translate.x=e.clientX-dx; translate.y=e.clientY-dy; applyTransform(); });
window.addEventListener('mouseup',()=>{dragging=false; svg.classList.remove('drag');});
svg.addEventListener('wheel',e=>{ e.preventDefault(); const f=e.deltaY<0?1.13:0.885; scale=Math.min(3.2,Math.max(.25,scale*f)); applyTransform(); },{passive:false});
document.getElementById('zIn').onclick=()=>{scale=Math.min(3.2,scale*1.2); applyTransform();};
document.getElementById('zOut').onclick=()=>{scale=Math.max(.25,scale/1.2); applyTransform();};
document.getElementById('zFit').onclick=fitView;

/* legend */
function buildLegend(){
  const bar=document.getElementById('legendBar');
  for(const dim of Object.keys(DIMS)){
    const el=document.createElement('div');
    el.className='legend-item'; el.dataset.dim=dim;
    el.innerHTML=`<span class="dot" style="background:${DIMS[dim].color}"></span>${DIMS[dim].name}<span style="opacity:.65">${(groupBy[dim]||[]).length}</span>`;
    el.title=DIMS[dim].desc;
    el.onclick=()=>{ if(visibleDims.has(dim)){ visibleDims.delete(dim); el.classList.add('off'); } else { visibleDims.add(dim); el.classList.remove('off'); } applyVisibility(); };
    bar.appendChild(el);
  }
  const st=document.createElement('div'); st.className='statusLegend';
  st.innerHTML=Object.entries(STATUS).map(([s,v])=>`<span title="${v.name}"><span class="ring" style="border-color:${v.color}"></span>${v.name}</span>`).join('');
  bar.appendChild(st);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* init */
document.getElementById('stats').textContent=`${NODES.length} 节点 · ${EDGES.length} 关系 · 6 簇`;
buildLegend();
renderGraph();
fitView();
showDetail('r_root');
window.showDetail=showDetail; window.toggleChk=toggleChk;
/* 深链：#n=<节点ID> —— 从《v0.1 发布过程任务列表》KG 引用列直达图谱节点 */
function handleHash(){
  const m=String(location.hash||'').match(/^#n=([A-Za-z0-9_-]+)/);
  if(m && nodeById[m[1]]){ showDetail(m[1]); }
}
window.addEventListener('hashchange', handleHash);
setTimeout(handleHash, 200);
</script>
